<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PROTOTYPE — 営業中ハブ20件表示</title>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body>
  <!--
    PROTOTYPE — THROW AWAY
    Four variants of the 20-open-slip sales hub, switchable via ?variant=.
    No data is saved and no production API is called.
  -->
  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <span class="brand__mark">P</span>
        <span>店舗用アプリ</span>
      </div>
      <nav class="main-nav" aria-label="メイン">
        <a class="is-active" href="#">営業中</a>
        <a href="#">マスタ設定</a>
        <a href="#">管理者設定</a>
      </nav>
      <div class="store-name">mieu本店</div>
    </div>
  </header>

  <div class="workflow">
    <div class="workflow__inner">
      <div class="workflow__step is-active"><span>1</span><strong>営業中</strong></div>
      <div class="workflow__step"><span>2</span><strong>締め作業</strong></div>
    </div>
  </div>

  <main id="prototypeApp" class="prototype-shell" aria-live="polite"></main>

  <div class="prototype-switcher" role="group" aria-label="プロトタイプ案の切り替え">
    <button type="button" data-variant-previous aria-label="前の案">←</button>
    <div>
      <span class="prototype-switcher__eyebrow">PROTOTYPE</span>
      <strong data-variant-label>A — 高密度台帳</strong>
    </div>
    <button type="button" data-variant-next aria-label="次の案">→</button>
  </div>

  <script src="./prototype.js"></script>
</body>
</html>
