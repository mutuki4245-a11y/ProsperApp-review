name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET 10 build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ProsperApp.slnx
      - run: dotnet build ProsperApp.slnx --configuration Release --no-restore
      - run: dotnet test ProsperApp.slnx --configuration Release --no-build

  javascript:
    name: Node 24 tests and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test ProsperApp/Tests/*.test.mjs
      - name: Check project JavaScript syntax
        run: find ProsperApp/wwwroot/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  edge:
    name: Deno Edge check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check ProsperApp/supabase/functions/prosper-rpc/index.ts
      - run: deno test ProsperApp/supabase/functions/prosper-rpc/security_test.ts
